name: GitHub-Profile-Summary-Cards

on:
  schedule: # execute every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate

    steps:
      # 第三者の Action は書き換えられないようコミット SHA で固定する（タグは作者が差し替えられる）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # カードの作成: 非公開リポジトリの言語も集計するため、読み取り専用・期限付きの Fine-grained トークンを渡す。
      # push はこの Action にさせない（AUTO_PUSH: false）
      - uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f # release (2026-08-06)
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_READ_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false
      # push: この実行の間だけ有効でこのリポジトリにしか使えない組み込みトークン（checkout が設定済み）で行う
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Generate profile summary cards"
          git push
